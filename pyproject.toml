[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-performance-copilot"
version = "0.1.0"
description = "Weekly paid-media review across Meta, Google and LinkedIn: diagnostics, creative fatigue, and a budget shift plan."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vishwajeet Kumbhar" }]
dependencies = []

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
adcopilot = "adcopilot.report:main"

[tool.setuptools]
packages = ["adcopilot"]
